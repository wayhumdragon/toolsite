<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Image Resizer - Resize Images for All Platforms</title>
  <meta name="description" content="Resize images for Instagram, Facebook, Twitter, LinkedIn, TikTok, YouTube and more. 100% client-side — no upload to server.">
  <meta property="og:title" content="Social Media Image Resizer - Free Online Tool">
  <meta property="og:description" content="Resize images to perfect dimensions for every social platform. 100% private.">
  <link rel="stylesheet" href="../global.css">
  <style>
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .preset-btn {
      padding: 0.55rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      transition: all 0.15s;
    }
    .preset-btn:hover, .preset-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .preset-btn .size { font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 0.15rem; }
    .preview-wrap {
      text-align: center;
      margin: 1.25rem 0;
    }
    .preview-wrap canvas {
      max-width: 100%;
      max-height: 360px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .dim-info {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="tool-wrap">
    <div class="tool-header">
      <h1>Social Media Image Resizer</h1>
      <p>Resize your image to the perfect dimensions for any social platform. All processing is local.</p>
    </div>

    <div class="card">
      <div class="upload-zone" id="dropZone" style="padding:2rem 1.5rem;">
        <div class="icon">&#x1F5BC;</div>
        <h3>Drop an image or click to upload</h3>
        <p>JPG, PNG, WebP — any size works</p>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      </div>

      <div id="editorPanel" style="display:none;">
        <label>Platform Preset</label>
        <div class="preset-grid" id="presetGrid">
          <button class="preset-btn active" data-w="1080" data-h="1080">Instagram<span class="size">1080 × 1080</span></button>
          <button class="preset-btn" data-w="1080" data-h="1920">Instagram Story<span class="size">1080 × 1920</span></button>
          <button class="preset-btn" data-w="1200" data-h="630">Facebook<span class="size">1200 × 630</span></button>
          <button class="preset-btn" data-w="1200" data-h="675">Twitter / X<span class="size">1200 × 675</span></button>
          <button class="preset-btn" data-w="1200" data-h="627">LinkedIn<span class="size">1200 × 627</span></button>
          <button class="preset-btn" data-w="1080" data-h="1920">TikTok<span class="size">1080 × 1920</span></button>
          <button class="preset-btn" data-w="1280" data-h="720">YouTube Thumb<span class="size">1280 × 720</span></button>
          <button class="preset-btn" data-w="400" data-h="400">WhatsApp DP<span class="size">400 × 400</span></button>
          <button class="preset-btn" data-w="1920" data-h="1080">Desktop BG<span class="size">1920 × 1080</span></button>
        </div>

        <div class="preview-wrap">
          <canvas id="preview"></canvas>
        </div>
        <div class="dim-info" id="dimInfo"></div>

        <div class="bar" style="justify-content:center;">
          <label>Quality
            <select id="qualitySelect">
              <option value="0.9">High (90%)</option>
              <option value="0.75" selected>Medium (75%)</option>
              <option value="0.5">Low (50%)</option>
            </select>
          </label>
          <button class="btn" id="btnDownload" disabled>&#x2B07; Download</button>
          <button class="btn btn-outline btn-sm" id="btnReset">New Image</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="../layout.js"></script>
<script>
(function() {
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var editorPanel = document.getElementById('editorPanel');
  var presetGrid = document.getElementById('presetGrid');
  var preview = document.getElementById('preview');
  var dimInfo = document.getElementById('dimInfo');
  var qualitySelect = document.getElementById('qualitySelect');
  var btnDownload = document.getElementById('btnDownload');
  var btnReset = document.getElementById('btnReset');

  var originalImage = null;
  var targetW = 1080, targetH = 1080;

  dropZone.addEventListener('click', function() { fileInput.click(); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length) loadImage(fileInput.files[0]);
  });

  function loadImage(file) {
    if (!file.type.match(/image\/(jpeg|png|webp|gif|bmp|svg)/)) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        originalImage = img;
        dropZone.style.display = 'none';
        editorPanel.style.display = 'block';
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function render() {
    if (!originalImage) return;
    var canvas = preview;
    var ctx = canvas.getContext('2d');

    // Fit image within target dimensions, maintaining aspect ratio
    var scale = Math.min(targetW / originalImage.width, targetH / originalImage.height);
    var sw = originalImage.width * scale;
    var sh = originalImage.height * scale;

    canvas.width = targetW;
    canvas.height = targetH;

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, targetW, targetH);

    // Center
    var x = (targetW - sw) / 2;
    var y = (targetH - sh) / 2;
    ctx.drawImage(originalImage, x, y, sw, sh);

    dimInfo.textContent = targetW + ' × ' + targetH + ' px';
    btnDownload.disabled = false;
  }

  presetGrid.addEventListener('click', function(e) {
    var btn = e.target.closest('.preset-btn');
    if (!btn) return;
    presetGrid.querySelectorAll('.preset-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    targetW = parseInt(btn.dataset.w);
    targetH = parseInt(btn.dataset.h);
    render();
  });

  qualitySelect.addEventListener('change', render);

  btnDownload.addEventListener('click', function() {
    if (!originalImage) return;
    var canvas = preview;
    var link = document.createElement('a');
    link.download = 'resized-' + targetW + 'x' + targetH + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', parseFloat(qualitySelect.value));
    link.click();
  });

  btnReset.addEventListener('click', function() {
    originalImage = null;
    fileInput.value = '';
    editorPanel.style.display = 'none';
    dropZone.style.display = 'block';
    btnDownload.disabled = true;
  });
})();
</script>

</body>
</html>
