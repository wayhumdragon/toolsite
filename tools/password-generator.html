<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - Generate Strong Random Passwords</title>
  <meta name="description" content="Generate strong, secure passwords with custom length and character sets. 100% client-side — generated locally, never transmitted.">
  <meta property="og:title" content="Password Generator - Free Online Tool">
  <meta property="og:description" content="Generate strong, secure passwords with custom rules. 100% private, generated in your browser.">
  <link rel="stylesheet" href="../global.css">
  <style>
    .pw-display {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }
    .pw-display input {
      flex: 1;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .pw-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 0.5rem;
      transition: width 0.2s, background 0.2s;
    }
    .pw-strength.weak   { width: 25%; background: #cf222e; }
    .pw-strength.fair   { width: 50%; background: #f59e0b; }
    .pw-strength.good   { width: 75%; background: #2da44e; }
    .pw-strength.strong { width: 100%; background: #10b981; }
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #lengthValue { font-weight: 600; min-width: 2.5ch; display: inline-block; }
  </style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="tool-wrap">
    <div class="tool-header">
      <h1>Password Generator</h1>
      <p>Generate cryptographically strong passwords. Customize length and character sets. Everything happens in your browser.</p>
    </div>

    <div class="card">
      <div class="pw-display">
        <input type="text" id="pwOutput" readonly placeholder="Your password will appear here...">
        <button class="btn" id="btnGenerate">Generate</button>
        <button class="btn btn-outline btn-sm" id="btnCopy">Copy</button>
      </div>
      <div class="pw-strength" id="strengthBar" style="width:0;"></div>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem;" id="strengthLabel">&nbsp;</p>

      <div style="margin-top:1.25rem;">
        <label>Length: <strong id="lengthValue">16</strong></label>
        <input type="range" id="lengthSlider" min="6" max="64" value="16" style="width:100%;">
      </div>

      <div class="checkbox-group mt-2">
        <label><input type="checkbox" id="chkUpper" checked> A-Z Uppercase</label>
        <label><input type="checkbox" id="chkLower" checked> a-z Lowercase</label>
        <label><input type="checkbox" id="chkDigits" checked> 0-9 Digits</label>
        <label><input type="checkbox" id="chkSymbols"> !@#$%^&* Symbols</label>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="../layout.js"></script>
<script>
(function() {
  var pwOutput = document.getElementById('pwOutput');
  var btnGenerate = document.getElementById('btnGenerate');
  var btnCopy = document.getElementById('btnCopy');
  var lengthSlider = document.getElementById('lengthSlider');
  var lengthValue = document.getElementById('lengthValue');
  var strengthBar = document.getElementById('strengthBar');
  var strengthLabel = document.getElementById('strengthLabel');
  var chkUpper = document.getElementById('chkUpper');
  var chkLower = document.getElementById('chkLower');
  var chkDigits = document.getElementById('chkDigits');
  var chkSymbols = document.getElementById('chkSymbols');

  var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var LOWER = 'abcdefghijklmnopqrstuvwxyz';
  var DIGITS = '0123456789';
  var SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

  function getStrength(length, pools) {
    var poolSize = pools.length;
    var entropy = length * Math.log2(poolSize || 1);
    if (entropy < 28) return ['weak', 'Weak'];
    if (entropy < 40) return ['fair', 'Fair'];
    if (entropy < 60) return ['good', 'Good'];
    return ['strong', 'Strong'];
  }

  function generate() {
    var pools = [];
    if (chkUpper.checked) pools.push(UPPER);
    if (chkLower.checked) pools.push(LOWER);
    if (chkDigits.checked) pools.push(DIGITS);
    if (chkSymbols.checked) pools.push(SYMBOLS);

    if (pools.length === 0) {
      pwOutput.value = '';
      strengthBar.style.width = '0';
      strengthBar.className = 'pw-strength';
      strengthLabel.textContent = 'Select at least one character set.';
      btnCopy.disabled = true;
      return;
    }

    var all = pools.join('');
    var len = parseInt(lengthSlider.value);
    var arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    var pw = '';
    for (var i = 0; i < len; i++) {
      pw += all[arr[i] % all.length];
    }

    // Ensure at least one char from each selected pool
    for (var p = 0; p < pools.length; p++) {
      var pos = (arr[p] || p) % len;
      pw = pw.substring(0, pos) + pools[p][arr[p] % pools[p].length] + pw.substring(pos + 1);
    }

    pwOutput.value = pw;
    btnCopy.disabled = false;

    var s = getStrength(len, all);
    strengthBar.className = 'pw-strength ' + s[0];
    strengthLabel.textContent = s[1] + ' password';
  }

  btnGenerate.addEventListener('click', generate);
  lengthSlider.addEventListener('input', function() {
    lengthValue.textContent = lengthSlider.value;
    generate();
  });

  [chkUpper, chkLower, chkDigits, chkSymbols].forEach(function(cb) {
    cb.addEventListener('change', generate);
  });

  btnCopy.addEventListener('click', function() {
    if (!pwOutput.value) return;
    navigator.clipboard.writeText(pwOutput.value).then(function() {
      var orig = btnCopy.textContent;
      btnCopy.textContent = 'Copied!';
      setTimeout(function() { btnCopy.textContent = orig; }, 1500);
    }).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = pwOutput.value;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      var orig = btnCopy.textContent;
      btnCopy.textContent = 'Copied!';
      setTimeout(function() { btnCopy.textContent = orig; }, 1500);
    });
  });

  generate();
})();
</script>

</body>
</html>
